name: deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Builds the static export on the pi5 runner (`docker` label, Node 24 on
# Debian 13, arm64) and uploads out/ to the Cloudflare Pages project
# `portfolio`, which serves s34nj0hn.dev. Pull requests only build.
# Follows developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/.
jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: docker
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.147.0 pages deploy out
          --project-name=portfolio
          --branch=main
          --commit-hash="${{ github.sha }}"
